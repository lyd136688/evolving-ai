<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 自进化 AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            text-align: center;
            color: white;
        }
        .header h1 { font-size: 24px; margin-bottom: 5px; }
        .status { font-size: 14px; opacity: 0.8; }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }
        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .message.ai {
            background: white;
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .message.user {
            background: rgba(255,255,255,0.2);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .input-area {
            background: white;
            padding: 15px;
            display: flex;
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }
        #userInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
        }
        #userInput:focus { border-color: #667eea; }
        #sendBtn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }
        #sendBtn:disabled { opacity: 0.5; }
        .quick-actions {
            display: flex;
            gap: 10px;
            padding: 10px 20px;
            overflow-x: auto;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }
        .action-btn {
            padding: 8px 16px;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }
        .action-btn:hover { background: rgba(255,255,255,0.3); }
        .typing { opacity: 0.6; font-style: italic; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🧠 自进化 AI 系统</h1>
        <p class="status">状态：就绪 | 版本：1.0.0</p>
    </div>
    
    <div class="chat-container" id="chatContainer">
        <div class="message ai">
            欢迎使用自进化 AI！我可以帮你：<br>
            • 创建功能模块<br>
            • 学习编程语言<br>
            • 分析代码<br>
            • 自我评估优化<br><br>
            请输入你的任务~
        </div>
    </div>
    
    <div class="quick-actions">
        <button class="action-btn" onclick="quickAction('创建一个日志模块')">📝 创建模块</button>
        <button class="action-btn" onclick="quickAction('学习 Go 语言')">📚 学习语言</button>
        <button class="action-btn" onclick="quickAction('查看系统状态')">📊 系统状态</button>
        <button class="action-btn" onclick="quickAction('自我评估')"> 自我评估</button>
    </div>
    
    <div class="input-area">
        <input type="text" id="userInput" placeholder="输入任务..." onkeypress="handleKeyPress(event)">
        <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>
    
    <script>
        // 模拟 AI 响应
        const responses = {
            '创建': '✅ 收到任务！正在创建模块...\n\n1. ✓ 分析需求\n2. ⏳ 生成代码结构\n3. ⏳ 编写实现\n4. ⏳ 添加测试\n\n预计完成时间：2 分钟',
            '学习': '📚 开始学习！\n\n我将：\n1. 分析语法特性\n2. 创建示例代码\n3. 生成学习路径\n4. 实践项目\n\n让我们开始吧！',
            '状态': ' 系统状态\n\n• 感知层：就绪\n• 认知层：就绪\n• 执行层：就绪\n• 记忆中心：正常\n• 元认知：活跃\n\n内存使用：正常\n任务队列：空闲',
            '评估': '🔍 自我评估报告\n\n优势：\n✓ 代码生成准确率高\n✓ 学习速度快\n✓ 记忆持久化\n\n改进点：\n• 网络学习优化\n• 多语言支持扩展\n\n下次迭代计划：优化推理速度',
            'default': '收到任务！正在处理中... 我会尽快完成！'
        };
        
        function quickAction(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }
        
        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }
        
        function appendMessage(content, isUser) {
            const container = document.getElementById('chatContainer');
            const div = document.createElement('div');
            div.className = 'message ' + (isUser ? 'user' : 'ai');
            div.innerHTML = content;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
        
        function sendMessage() {
            const input = document.getElementById('userInput');
            const btn = document.getElementById('sendBtn');
            const message = input.value.trim();
            
            if (!message) return;
            
            // 显示用户消息
            appendMessage(message, true);
            input.value = '';
            btn.disabled = true;
            
            // 显示正在输入
            const container = document.getElementById('chatContainer');
            const typing = document.createElement('div');
            typing.className = 'message ai typing';
            typing.id = 'typing';
            typing.innerHTML = '正在思考...';
            container.appendChild(typing);
            container.scrollTop = container.scrollHeight;
            
            // 模拟 AI 响应（1 秒后）
            setTimeout(() => {
                document.getElementById('typing').remove();
                
                // 匹配响应
                let response = responses['default'];
                for (const [key, value] of Object.entries(responses)) {
                    if (message.includes(key)) {
                        response = value;
                        break;
                    }
                }
                
                appendMessage(response.replace(/\n/g, '<br>'), false);
                btn.disabled = false;
                input.focus();
            }, 1000);
        }
    </script>
</body>
</html>
